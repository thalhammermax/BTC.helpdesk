services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: helpdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://helpdesk:${POSTGRES_PASSWORD:-change-me}@db:5432/helpdesk
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
      # Google service-account key for the Gmail connector (GMAIL_AUTH=service_account).
      # Remove this line if you use GMAIL_AUTH=oauth or GOOGLE_SERVICE_ACCOUNT_JSON instead.
      - ./secrets/google-sa.json:/run/secrets/google-sa.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
